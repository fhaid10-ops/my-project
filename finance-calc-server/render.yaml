# نشر الكوبري على Render
# من لوحة Render: New → Blueprint → اختر هذا الريبو
# أو Web Service يدويًا مع Root Directory = finance-calc-server

services:
  - type: web
    name: raed-kobri
    runtime: node
    plan: free
    rootDir: finance-calc-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INTERAKT_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
